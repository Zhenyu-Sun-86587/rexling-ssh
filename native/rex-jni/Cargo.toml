[package]
name = "rex-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
jni = { version = "0.21.1", default-features = false }
rex-core = { path = "../rex-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync"] }
