[package]
name = "rex-probe"
version = "0.1.0"
edition = "2024"
description = "Independent Rex control and terminal-data protocol probe"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
percent-encoding = "2.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "time", "signal", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
