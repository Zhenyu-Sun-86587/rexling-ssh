name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      GODEBUG: http2client=0
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: rexling-network/go.mod
          cache: false
      - name: Install Rust and Android build tools
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370'

      - name: Test Go network module
        working-directory: rexling-network
        run: go test -mod=readonly ./...

      - name: Test Rust workspace and host JNI
        run: python3 rexling-android/scripts/test_jni.py

      - name: Build and test Android debug APK
        shell: bash
        run: |
          # Gradle reads the release signing configuration even for debug tasks.
          # Supply a disposable identity; the debug APK uses Android's own debug key.
          umask 077
          signing=$(mktemp -d "$RUNNER_TEMP/rex-signing.XXXXXX")
          trap 'rm -rf "$signing"' EXIT
          printf '%s\n' android > "$signing/password"
          keytool -genkeypair -keystore "$signing/unused.p12" -alias ci -keyalg RSA \
            -dname 'CN=Rexling CI' -validity 1 -storepass:file "$signing/password"
          printf 'storeFile=%s\nkeyAlias=ci\npasswordFile=%s\n' \
            "$signing/unused.p12" "$signing/password" > "$signing/signing.properties"
          export REXLING_SSH_SIGNING_PROPERTIES="$signing/signing.properties"
          ./rexling-android/scripts/gradle.sh --no-daemon --max-workers=4 \
            :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest

      - name: Verify APK packaging, signature, and alignment
        run: python3 rexling-android/scripts/verify_apk.py

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rexling-debug-arm64
          path: rexling-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
